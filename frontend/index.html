<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Мессенджер</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div id="app">
    <!-- Экран авторизации -->
    <section id="auth-screen" class="screen auth-screen">
      <div class="auth-card">
        <div class="auth-tabs">
          <button class="auth-tab active" data-tab="login">Вход</button>
          <button class="auth-tab" data-tab="register">Регистрация</button>
        </div>

        <form id="login-form" class="auth-form active">
          <div class="form-group">
            <input type="text" id="login-username" placeholder="Логин или Email" required autocomplete="username">
            <span class="input-highlight"></span>
          </div>
          <div class="form-group">
            <input type="password" id="login-password" placeholder="Пароль" required autocomplete="current-password">
            <span class="input-highlight"></span>
          </div>
          <button type="submit" class="btn-primary">Войти</button>
          <p class="auth-error" id="login-error"></p>
        </form>

        <form id="register-form" class="auth-form">
          <div class="form-group">
            <input type="text" id="reg-login" placeholder="Логин" required>
            <span class="input-highlight"></span>
          </div>
          <div class="form-group">
            <input type="email" id="reg-email" placeholder="Email" required>
            <span class="input-highlight"></span>
          </div>
          <div class="form-group">
            <input type="text" id="reg-nickname" placeholder="Никнейм" required>
            <span class="input-highlight"></span>
          </div>
          <div class="form-group">
            <input type="password" id="reg-password" placeholder="Пароль" required>
            <span class="input-highlight"></span>
          </div>
          <button type="submit" class="btn-primary">Зарегистрироваться</button>
          <p class="auth-error" id="reg-error"></p>
        </form>
      </div>
    </section>

    <!-- Основной экран мессенджера -->
    <section id="chat-screen" class="screen chat-screen" style="display:none;">
      <div class="chat-layout">
        <aside id="sidebar" class="sidebar">
          <div class="sidebar-resize-handle"></div>
          <div class="sidebar-header">
            <div class="search-box">
              <input type="text" id="search-input" placeholder="Поиск собеседника..." autocomplete="off">
              <span class="search-icon">🔍</span>
              <div id="search-results" class="search-results"></div>
            </div>
          </div>
          <div id="contact-list" class="contact-list"></div>
          <div class="sidebar-footer">
            <div class="user-info">
              <span id="current-user-nickname"></span>
              <button id="settings-btn" class="btn-icon-settings" title="Настройки">⚙️</button>
              <button id="logout-btn" class="btn-logout" title="Выйти">Выйти</button>
            </div>
          </div>
        </aside>

        <main class="chat-main" id="chat-main">
          <header class="chat-header" id="chat-header" style="display:none;">
            <button id="back-to-contacts" class="back-btn">←</button>
            <span id="chat-partner-name"></span>
          </header>

          <div id="no-chat-placeholder" class="no-chat-placeholder">
            <p>Выберите собеседника из списка справа.</p>
            <p>Если его там нет, найдите собеседника через поиск.</p>
          </div>

          <div id="messages-container" class="messages-container" style="display:none;"></div>

          <div id="reply-preview" class="reply-preview" style="display:none;">
            <div class="reply-preview-content">
              <span id="reply-text"></span>
              <div id="reply-attachment-preview"></div>
              <button id="cancel-reply" class="btn-cancel-reply">✕</button>
            </div>
          </div>

          <div class="message-input-area" id="message-input-area" style="display:none;">
            <input type="file" id="file-input" accept="image/*,audio/*" style="display:none;" multiple>
            <button id="attach-btn" class="btn-icon" title="Прикрепить файл">📎</button>
            <button id="voice-record-btn" class="btn-icon" title="Голосовое сообщение">🎤</button>
            <textarea id="message-input" placeholder="Введите сообщение..." rows="1"></textarea>
            <button id="send-btn" class="btn-send" title="Отправить">➤</button>
          </div>
        </main>
      </div>
    </section>
  </div>

  <!-- Модальное окно для изображений -->
  <div id="image-modal" class="image-modal">
    <span class="image-modal-close">&times;</span>
    <img class="image-modal-content" id="full-image" src="" alt="Полноразмерное изображение">
  </div>

  <!-- Модальное окно настроек -->
  <div id="settings-modal" class="modal-overlay" style="display:none;">
    <div class="modal-content">
      <h2>Настройки</h2>
      <div class="settings-section">
        <label>Изменить никнейм</label>
        <input type="text" id="new-nickname-input" placeholder="Новый никнейм">
        <button id="save-nickname-btn" class="btn-primary">Сохранить</button>
        <p id="nickname-error" class="error-message"></p>
      </div>
      <div class="settings-section">
        <label>Фон чата</label>
        <div class="bg-palette">
          <div class="bg-option" style="background: #808080;" data-bg="#808080"></div>
          <div class="bg-option" style="background: #404040;" data-bg="#404040"></div>
          <div class="bg-option" style="background: #f0f0f0;" data-bg="#f0f0f0"></div>
          <div class="bg-option" style="background: #e8f5e9;" data-bg="#e8f5e9"></div>
          <div class="bg-option" style="background: #a0c4ff;" data-bg="#a0c4ff"></div>
          <div class="bg-option" style="background: #ffd6a5;" data-bg="#ffd6a5"></div>
        </div>
        <input type="color" id="custom-bg-color" value="#c5d6d6">
      </div>
      <button id="close-settings-btn" class="btn-secondary">Закрыть</button>
    </div>
  </div>

  <button id="theme-toggle" class="btn-theme-toggle">Сменить тему</button>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.5/signalr.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
